name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      PROJECT: src/Daybook.App/Daybook.App.csproj
      RID: win-x64
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          # v0.1 -> 0.1.0, v1.2.3-beta -> 1.2.3 + beta
          if ($env:TAG -notmatch '^v?(\d+(?:\.\d+){0,3})(?:-([0-9A-Za-z.-]+))?$') {
            throw "Tag '$env:TAG' is not a version (expected e.g. v1.2 or v1.2.3-beta)"
          }
          $parts = $Matches[1].Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          "VERSION_PREFIX=$($parts -join '.')" >> $env:GITHUB_ENV
          "VERSION_SUFFIX=$($Matches[2])" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r ${{ env.RID }}

      - name: Publish framework-dependent
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r ${{ env.RID }} --no-restore
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:VersionPrefix=${{ env.VERSION_PREFIX }}
          -p:VersionSuffix=${{ env.VERSION_SUFFIX }}
          -o out/framework-dependent

      - name: Publish self-contained
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r ${{ env.RID }} --no-restore
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:VersionPrefix=${{ env.VERSION_PREFIX }}
          -p:VersionSuffix=${{ env.VERSION_SUFFIX }}
          -o out/self-contained

      - name: Zip binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($flavor in 'framework-dependent', 'self-contained') {
            Compress-Archive -Path "out/$flavor/Daybook.App.exe" `
              -DestinationPath "dist/Daybook-$env:TAG-$env:RID-$flavor.zip" -Force
          }

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:TAG" (Get-ChildItem dist/*.zip).FullName --clobber
